name: CI

# Vérifie chaque PR (dont celles de Dependabot) et chaque push sur develop :
# une PR rouge ne doit pas être fusionnée.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20        # même version que le Dockerfile
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # `npm run lint` n'est pas lancé : 32 erreurs préexistantes (surtout no-require-imports).
      # À ajouter ici une fois ces erreurs corrigées.
      - name: Build
        run: npm run build
        env:
          # Base factice : le build lit DATABASE_URL pour construire le client Prisma, sans s'y connecter.
          DATABASE_URL: file:./ci.db
          NEXT_TELEMETRY_DISABLED: "1"
